version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
  worker:
    build: .
    command: ["dramatiq", "app.worker", "-p", "1", "-t", "1"]
    env_file: .env
    depends_on:
      - db
      - redis
volumes:
  pgdata:
    driver: local
